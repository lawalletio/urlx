name: 'Check code'

on:
  push:
    paths-ignore:
      - 'umbrel-app/**'
      - 'README.md'
      - 'LICENSE.md'
      - '.env.*'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'umbrel-app/**'
      - 'README.md'
      - 'LICENSE.md'
      - '.env.*'
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies
        run: pnpm install
      - name: Run lint check
        run: pnpm lint:check
      - name: Run prettier check
        run: pnpm prettier:check
